<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz des Maries</title>


  <style>
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; background: #f0f2f5; color: #1c1e21; }
.card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); min-height: 420px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
h2 { color: #8a2be2; text-align: center; margin: 0 0 15px 0; font-size: 24px; }
.progress-container { background: #e4e6eb; border-radius: 10px; height: 8px; width: 100%; margin-bottom: 10px; overflow: hidden; }
.progress-bar { background: #8a2be2; height: 100%; width: 0%; transition: width 0.3s ease; }
.timer-container { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: #ff9800; margin-bottom: 15px; }
.step-text { color: #8a2be2; }
input[type="text"], input[type="password"] { width: 100%; padding: 14px; margin: 10px 0 15px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
input[type="text"]:focus, input[type="password"]:focus { border-color: #8a2be2; }
.question-box { display: none; }
.question-box.active { display: block; animation: fadeIn 0.3s ease-in-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.question-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #1c1e21; line-height: 1.4; }
.option-label { display: flex; align-items: center; padding: 14px 16px; margin: 10px 0; border-radius: 12px; background: #f7f8fa; border: 2px solid #e4e6eb; cursor: pointer; transition: all 0.2s ease; font-size: 16px; font-weight: 500; }
.option-label:hover { background: #f0e6ff; border-color: #d1b3ff; }
.option-label input[type="radio"] { margin-right: 12px; transform: scale(1.3); accent-color: #8a2be2; }
.option-label.selected { background: #f0e6ff; border-color: #8a2be2; color: #8a2be2; font-weight: 600; }
.rules-box { background: #f7f8fa; border: 1px solid #e4e6eb; border-radius: 12px; padding: 15px; margin-bottom: 15px; font-size: 14px; line-height: 1.5; color: #4b4f56; }
.rules-box b { color: #8a2be2; }
.nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; display: inline-block; }
.btn-next { background: #8a2be2; color: white; }
.btn-next:hover { background: #7322bf; }
.btn-prev { background: #e4e6eb; color: #4b4f56; }
.btn-prev:hover { background: #d8dadf; }
.btn-submit { background: #2e7d32; color: white; }
.btn-submit:hover { background: #1b5e20; }
.btn-secondary { background: #e4e6eb; color: #4b4f56; margin-top: 10px; }
.btn-secondary:hover { background: #d8dadf; }
.btn-correction { background: #ff9800; color: white; margin-top: 10px; }
.btn-correction:hover { background: #e68a00; }
.blocked { text-align: center; padding: 20px 10px; }
.blocked h2 { color: #8a2be2; margin-bottom: 10px; }
.humor-quote { font-style: italic; background: #f0e6ff; color: #5c1d96; padding: 12px; border-radius: 10px; margin: 15px 0; font-size: 14px; border-left: 4px solid #8a2be2; }
.corr-item { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; line-height: 1.4; }
.corr-item .q-title { font-weight: 600; color: #333; margin-bottom: 4px; }
.corr-item .q-ans { color: #2e7d32; font-weight: bold; }
/* Overlay Modal Code PIN */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
.modal-box { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div class="card" id="app">Chargement...</div>

<!-- Modal Code Administrateur -->
<div class="modal-overlay" id="modalPin">
<div class="modal-box">
<h3 style="margin-top: 0pt; color: rgb(138, 43, 226);">Acces Administrateur</h3>

<p style="font-size: 14px; color: rgb(102, 102, 102);">Entrez le code PIN :</p>

<input id="inputPin" inputmode="numeric" pattern="[0-9]*" maxlength="6" style="text-align: center; font-size: 22px; letter-spacing: 4px;" type="password">
<div style="margin-top: 10px;">
<button class="btn btn-prev" onclick="fermerModalPin()">Annuler</button>
<button class="btn btn-next" onclick="validerModalPin()">Valider</button>
</div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig = {
apiKey: "AIzaSyDASGPAd46ViG47ClRor_unIYDvxLDINDo",
authDomain: "quiz-mariage-6d977.firebaseapp.com",
databaseURL: "https://quiz-mariage-6d977-default-rtdb.firebaseio.com",
projectId: "quiz-mariage-6d977",
storageBucket: "quiz-mariage-6d977.appspot.com",
messagingSenderId: "1094285499360",
appId: "1:1094285499360:web:4cc3306a89b50df547e985"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const appDiv = document.getElementById("app");
let currentStep = 0;
const totalQuestions = 15;
let reponsesVisibles = false;
let questionStartTime = 0;
const MAX_TIME_PER_QUESTION = 15;
let timerInterval = null;
const questionsData = [
{ id: 1, title: "1. Ou les maries se sont-ils rencontres ?", options: ["College", "Soiree d'amis", "Sport"], correct: 0 },
{ id: 2, title: "2. Qui a fait le premier pas ?", options: ["Anais", "Les deux", "Seb"], correct: 2 },
{ id: 3, title: "3. Quel est leur plus grand plaisir quand ils ont du temps libre ?", options: ["Apero", "Sport", "Les calculs mentaux"], correct: 0 },
{ id: 4, title: "4. Sur quelle chanson le premier baiser ?", options: ["Sexual Healing de Marvin Gaye", "Les sardines de Patrick Sebastien", "Human Nature de Michael Jackson"], correct: 2 },
{ id: 5, title: "5. Leur premiere destination de vacances a deux ?", options: ["St Lary Soulan", "Chamonix", "St Jean de Monts"], correct: 2 },
{ id: 6, title: "6. Le surnom utilise ?", options: ["Bebe", "Mon amour", "Mon coeur"], correct: 0 },
{ id: 7, title: "7. Le cadeau le plus improbable que l'un a offert a l'autre ?", options: ["Une batterie de cuisine en inox", "44 cadeaux pour les 44 ans", "Une caricature dessinee par un artiste de rue"], correct: 1 },
{ id: 8, title: "8. L'endroit de la demande ?", options: ["St Jean de Monts", "Rouen", "Paris"], correct: 0 },
{ id: 9, title: "9. Leurs ages au moment de la rencontre ?", options: ["24 ans et 45 ans", "22 ans et 43 ans", "25 ans et 46 ans"], correct: 1 },
{ id: 10, title: "10. Depuis combien de temps ils sont ensemble ?", options: ["11 ans", "12 ans", "13 ans"], correct: 0 },
{ id: 11, title: "11. Leur premier concert ensemble ?", options: ["Les Insus", "Jean Louis Aubert", "M"], correct: 0 },
{ id: 12, title: "12. Quel est le pays dans lequel les maries reveraient de partir ensemble ?", options: ["Laponie", "Norvege", "Canada"], correct: 1 },
{ id: 13, title: "13. Quelle pourrait etre le voyage de noce ideal des maries ?", options: ["La Grece", "La Reunion", "Le Tour du Mont Blanc en bivouac"], correct: 2 },
{ id: 14, title: "14. Quelle passion insoupconnee les maries partagent-ils ?", options: ["Le PSG", "Les tulipes", "La peche a la truite"], correct: 0 },
{ id: 15, title: "15. Quelle boisson preferee des maries ?", options: ["L'eau benite", "Le vin", "Le jus de cactus"], correct: 1 }
];
let deviceId = localStorage.getItem("quiz_device_id");
if (!deviceId) {
deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
localStorage.setItem("quiz_device_id", deviceId);
}
onValue(ref(db, 'settings/reponsesDebloquees'), (snapshot) => {
reponsesVisibles = snapshot.val() === true;
checkStatus();
});
function checkStatus() {
get(ref(db, 'participants/' + deviceId)).then((snapshot) => {
if (snapshot.exists()) {
afficherEcranFin(snapshot.val().nom, snapshot.val().bonnesReponses, snapshot.val().score);
} else {
initApp();
}
}).catch(() => {
initApp();
});
}
window.checkStatus = checkStatus;
function getHumorMessage(bonnesReponses) {
if (bonnesReponses <= 3) {
return "Zero pointe ! Tu es venu uniquement pour le vin et le gateau, avoue tout ! &#127863;";
} else if (bonnesReponses <= 7) {
return "C'est un score mystere... Tu a du confondre nos vies avec un episode de tele-realite. &#128250;";
} else if (bonnesReponses <= 11) {
return "Honnête ! Tu nous connais assez pour ne pas dire de betises, mais pas assez pour nous rançonner. &#129323;";
} else if (bonnesReponses <= 14) {
return "Presque parfait ! Tu merites une part de tarte en plus et notre estime eternelle. &#127941;";
} else {
return "15/15 ! Soit tu es l'un de nous deux, soit tu as pirate le telephone de notre temoin ! Chapeau l'artiste ! &#128275;";
}
}
function afficherEcranFin(nom, bonnesReponses, scoreTotal) {
let btnCorrHTML = reponsesVisibles ? `<button class="btn btn-correction" style="width:100%; margin-top:10px;" onclick="afficherCorrection()">Voir les reponses</button>` : '';
const messageHumour = getHumorMessage(bonnesReponses || 0);
appDiv.innerHTML = `
<div class="blocked">
<h2>Quiz Termine ! &#127881;</h2>
<p style="font-size:16px;">Merci <b>${escapeHtml(nom || '')}</b> !</p>
<p style="font-size:20px; margin: 10px 0;">Bonnes reponses : <b>${bonnesReponses !== undefined ? bonnesReponses : 0} / 15</b></p>
<p style="font-size:14px; color:#666; margin-bottom: 5px;">Score total (avec bonus rapidite) : <b>${scoreTotal !== undefined ? scoreTotal : 0} pts</b></p>
<div class="humor-quote">${messageHumour}</div>
<button class="btn btn-next" style="margin-top:10px; width:100%;" onclick="accederClassement()">Voir le classement &#127942;</button>
${btnCorrHTML}
</div>`;
}
window.accederClassement = function() {
const modal = document.getElementById("modalPin");
const inputPin = document.getElementById("inputPin");
inputPin.value = "";
modal.style.display = "flex";
inputPin.focus();
};
window.fermerModalPin = function() {
document.getElementById("modalPin").style.display = "none";
};
window.validerModalPin = function() {
const code = document.getElementById("inputPin").value;
if (code === "2204") {
sessionStorage.setItem("admin_auth", "true");
window.location.href = "classement.html";
} else {
alert("Code incorrect !");
document.getElementById("inputPin").value = "";
}
};
window.afficherCorrection = function() {
let html = `<h2 style="text-align:center; color:#ff9800; margin-bottom:15px;">Les Bonnes Reponses</h2><div style="max-height:340px; overflow-y:auto; margin-bottom:15px;">`;
questionsData.forEach(q => {
const bonneReponse = q.options[q.correct];
html += `
<div class="corr-item">
<div class="q-title">${q.title}</div>
<div class="q-ans">Reponse : ${bonneReponse}</div>
</div>`;
});
html += `</div><button class="btn btn-prev" style="width:100%;" onclick="checkStatus()">Retour</button>`;
appDiv.innerHTML = html;
};
function initApp() {
renderHTML();
bindEvents();
updateView();
}
function renderHTML() {
let questionsHTML = '';
questionsData.forEach((q) => {
let optionsHTML = '';
q.options.forEach((opt, index) => {
optionsHTML += `
<label class="option-label">
<input type="radio" name="q${q.id}" value="${index}"> ${opt}
</label>`;
});
questionsHTML += `
<div class="question-box" id="step-${q.id}">
<div class="question-title">${q.title}</div>
<div class="options-group">${optionsHTML}</div>
</div>`;
});
let btnCorrHTML = reponsesVisibles ? `<button class="btn btn-correction" style="width:100%;" onclick="afficherCorrection()">Voir les reponses</button>` : '';
appDiv.innerHTML = `
<div>
<h2>Quiz des Maries &#128141;</h2>
<div class="question-box active" id="step-0">
<div class="rules-box">
<b>Comment ca marche ?</b><br>
&#8226; <b>15 questions</b> pour tester ta connaissance des maries.<br>
&#8226; Chaque bonne reponse rapporte <b>100 points de base</b>.<br>
&#8226; <b>Bonus de rapidite en direct :</b> Un bonus s'ajoute et diminue seconde par seconde (de +50 pts max a 0 pt) selon ta vitesse sur un chrono de 15s ! A la fin, ton score total de bonnes reponses et tes points s'affichent.
</div>
<label for="pseudo"><b>Ton Prenom et Nom :</b></label>
<input type="text" id="pseudo" placeholder="Ex: Julie R." required>
</div>
<div class="progress-container" id="progress-container" style="display:none;">
<div class="progress-bar" id="progress-bar"></div>
</div>
<div class="timer-container" id="timer-container" style="display:none;">
<span class="step-text" id="step-text">Question 1 sur 15</span>
<span id="timer-display" style="background: #fff3e0; padding: 4px 8px; border-radius: 6px; border: 1px solid #ffe0b2;">Temps: 15s (+50 pts)</span>
</div>
${questionsHTML}
</div>
<div>
<div class="nav-buttons" id="nav-buttons-container">
<button class="btn btn-prev" id="btnPrev" style="display:none;">Precedent</button>
<button class="btn btn-next" id="btnNext">C'est parti !</button>
<button class="btn btn-submit" id="btnSubmit" style="display:none;">Valider mon Quiz</button>
</div>
<button class="btn btn-secondary" id="btnDirectClassement" style="width:100%; display:block; text-align:center; cursor:pointer;" onclick="accederClassement()">&#127942; Acces Classement (Maries)</button>
${btnCorrHTML}
</div>
`;
}
function bindEvents() {
document.getElementById("btnNext").addEventListener("click", nextMethod);
document.getElementById("btnPrev").addEventListener("click", prevStep);
document.getElementById("btnSubmit").addEventListener("click", submitQuiz);
document.querySelectorAll('.option-label input').forEach(input => {
input.addEventListener('change', (e) => {
const parentGroup = e.target.closest('.options-group');
parentGroup.querySelectorAll('.option-label').forEach(lbl => lbl.classList.remove('selected'));
e.target.closest('.option-label').classList.add('selected');
});
});
}
function updateView() {
if (timerInterval) clearInterval(timerInterval);
document.querySelectorAll('.question-box').forEach(el => el.classList.remove('active'));
document.getElementById(`step-${currentStep}`).classList.add('active');
const progressContainer = document.getElementById("progress-container");
const progressBar = document.getElementById("progress-bar");
const timerContainer = document.getElementById("timer-container");
const stepText = document.getElementById("step-text");
const btnPrev = document.getElementById("btnPrev");
const btnNext = document.getElementById("btnNext");
const btnSubmit = document.getElementById("btnSubmit");
const btnDirectClassement = document.getElementById("btnDirectClassement");
if (currentStep === 0) {
progressContainer.style.display = "none";
timerContainer.style.display = "none";
btnPrev.style.display = "none";
btnSubmit.style.display = "none";
btnNext.style.display = "block";
btnNext.textContent = "C'est parti !";
btnDirectClassement.style.display = "block";
} else {
progressContainer.style.display = "block";
timerContainer.style.display = "flex";
btnDirectClassement.style.display = "none";
const pct = (currentStep / totalQuestions) * 100;
progressBar.style.width = `${pct}%`;
stepText.textContent = `Question ${currentStep} sur ${totalQuestions}`;
btnPrev.style.display = "block";
questionStartTime = Date.now();
let timeLeft = MAX_TIME_PER_QUESTION;
const timerDisplay = document.getElementById("timer-display");
let currentBonus = Math.round((timeLeft / MAX_TIME_PER_QUESTION) * 50);
timerDisplay.textContent = `Temps: ${timeLeft}s (+${currentBonus} pts)`;
timerInterval = setInterval(() => {
timeLeft--;
if (timeLeft >= 0) {
let bonus = Math.round((timeLeft / MAX_TIME_PER_QUESTION) * 50);
timerDisplay.textContent = `Temps: ${timeLeft}s (+${bonus} pts)`;
} else {
timerDisplay.textContent = `Temps: 0s (+0 pt)`;
}
}, 1000);
if (currentStep === totalQuestions) {
btnNext.style.display = "none";
btnSubmit.style.display = "block";
} else {
btnNext.style.display = "block";
btnNext.textContent = "Suivante";
btnSubmit.style.display = "none";
}
}
}
let questionTimes = {};
function nextMethod() {
if (currentStep === 0) {
const pseudo = document.getElementById("pseudo").value.trim();
if (!pseudo) {
alert("Merci d'indiquer ton prenom !");
return;
}
} else {
const checked = document.querySelector(`input[name="q${currentStep}"]:checked`);
if (!checked) {
alert("Merci de selectionner une reponse !");
return;
}
const timeSpent = (Date.now() - questionStartTime) / 1000;
questionTimes[currentStep] = timeSpent;
}
if (currentStep < totalQuestions) {
currentStep++;
updateView();
}
}
function prevStep() {
if (currentStep > 0) {
currentStep--;
updateView();
}
}
function submitQuiz() {
const checked = document.querySelector(`input[name="q${totalQuestions}"]:checked`);
if (!checked) {
alert("Merci de selectionner une reponse !");
return;
}
const timeSpent = (Date.now() - questionStartTime) / 1000;
questionTimes[totalQuestions] = timeSpent;
if (timerInterval) clearInterval(timerInterval);
const pseudo = document.getElementById("pseudo").value.trim();
let bonnesReponses = 0;
let scoreTotal = 0;
questionsData.forEach(q => {
const val = document.querySelector(`input[name="q${q.id}"]:checked`)?.value;
if (val !== undefined && parseInt(val, 10) === q.correct) {
bonnesReponses++;
let time = questionTimes[q.id] || MAX_TIME_PER_QUESTION;
if (time > MAX_TIME_PER_QUESTION) time = MAX_TIME_PER_QUESTION;
let bonus = Math.round(((MAX_TIME_PER_QUESTION - time) / MAX_TIME_PER_QUESTION) * 50);
bonus = Math.max(0, Math.min(50, bonus));
scoreTotal += (100 + bonus);
}
});
set(ref(db, 'participants/' + deviceId), {
nom: pseudo,
bonnesReponses: bonnesReponses,
score: scoreTotal,
timestamp: Date.now()
}).then(() => {
afficherEcranFin(pseudo, bonnesReponses, scoreTotal);
}).catch(err => {
alert("Erreur d'envoi : " + err.message);
});
}
function escapeHtml(text) {
if (!text) return '';
return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
</body>
</html>
